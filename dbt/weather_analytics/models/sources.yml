version: 2

sources:
  - name: raw
    description: "Raw layer loaded by the Airflow DAG weather_etl"
    schema: raw
    tables:
      - name: weather_daily
        description: "One row per (city, date) from the Open-Meteo Forecast API: past days + forecast days"
        columns:
          - name: city
            data_tests:
              - not_null
          - name: date
            data_tests:
              - not_null
          - name: is_forecast
            data_tests:
              - not_null
